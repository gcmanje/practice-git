<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Form</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>

<div class="container">
    <div class="row">
        <div class="col-sm-4 mx-auto border">
            <div class="form">
                <div class="mb-2">
                    <label for="names" class="form-label text-success">Full Name</label>
                    <input type="text" class="form-control rounded-0" id="names">
                </div>
                <div class="mb-2">
                    <label for="email" class="form-label text-success">email</label>
                    <input type="email" class="form-control rounded-0" id="email">
                </div>
                <div class="mb-2">
                    <label for="password" class="form-label text-success">password</label>
                    <input type="password" class="form-control rounded-0" id="password">
                </div>
                <div class="mb-2">
                    <label for="dob" class="form-label text-success">Date Of Birth</label>
                    <input type="date" class="form-control rounded-0" id="dob">
                </div>
                <div class="mb-2">
                    <label for="edu" class="form-label text-success">Education</label>
                    <select id="edu" class="form-select">
                        <option value="" class="Option">University</option>
                        <option value="" class="Option">College</option>
                        <option value="" class="option">Polytechnic</option>
                        <option value="" class="option">Highschool</option>
                    </select>
                    <p class="text-success mb-0">Select Your Gender </p>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="radio1" name="gender" value="option1" checked>Male
                        <label class="form-check-label" for="radio1"></label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="radio2" name="gender" value="option2">Female
                        <label class="form-check-label" for="radio2"></label>
                    </div>

                    <p class="text-success mt-2 mb-0"> select Your Favourite Sport</p>


                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="check1" name="option1" value="something"
                               checked>
                        <label class="form-check-label">volleyball</label>
                    </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="check1" name="option1"
                                   value="something">
                            <label class="form-check-label">Soccer</label>
                        </div>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="check1" name="option1"
                                       value="something">
                                <label class="form-check-label">Netball</label>
                            </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="check1" name="option1"
                                           value="something">
                                    <label class="form-check-label">Rugby</label>
                                </div>


                                </div>
                                <button class="btn btn-danger w-100 rounded-0 my-2">submit</button>
                            </div>
                        </div>
                    </div>
                </div>


</body>
</html>
